; PHP overrides for Hostinger (php-cgi/FPM reads .user.ini per-directory).
;
; These ceilings MUST stay ABOVE the Laravel `max:` validation rules in the upload
; controllers. If PHP's limit is the lower of the two, PHP aborts the request before
; Laravel runs: files over upload_max_filesize arrive as UPLOAD_ERR_INI_SIZE, and
; bodies over post_max_size are discarded entirely — which drops the CSRF token and
; surfaces as a 419 "Page Expired" instead of a readable validation message.
;
; Current Laravel rule is max:8192 (8MB), so 16M leaves clear headroom.

upload_max_filesize = 16M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
